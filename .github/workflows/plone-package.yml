# Install the Python dependencies with uv, run ruff and the test suite with a
# coverage gate. See the Makefile for the targets used here.

name: Plone package

on:
    push:
        branches: [master, modernization]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13']

        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v5
            - name: Lint
              run: make lint PYTHON_VERSION=${{ matrix.python-version }}
            - name: Test with coverage
              run: make coverage PYTHON_VERSION=${{ matrix.python-version }}
            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              with:
                  fail_ci_if_error: false
              if: matrix.python-version == '3.13'
